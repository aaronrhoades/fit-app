name: Deploy Backend to Elastic Beanstalk

on:
  push:
    branches: [ main ] # Or your specific branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v2
        with:
          application-name: ${{ secrets.ELASTIC_BEANSTALK_APPLICATION_NAME }}
          environment-name: ${{ secrets.ELASTIC_BEANSTALK_ENVIRONMENT_NAME }}
          region: ${{ secrets.AWS_REGION }}
          source-bundle: FitAppApi/
          wait-for-deployment: true